<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4E5B52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>

</div>
