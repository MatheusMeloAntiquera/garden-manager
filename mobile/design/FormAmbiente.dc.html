<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 15px; font-weight: 700">Ambiente ativo</div>
<div style="font-size: 13px; color: #4E5B52">Desative para esconder da lista sem excluir</div>
</div>
<button type="button" role="switch" aria-checked="true" aria-label="Ambiente ativo" style="width: 52px; height: 32px; border-radius: 16px; border: 0; background: #2E5E45; padding: 4px; display: flex; justify-content: flex-end; align-items: center; flex-shrink: 0; cursor: pointer"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></button>

<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E5E45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path></svg>
