services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-garden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garden}
      POSTGRES_DB: ${POSTGRES_DB:-garden_manager}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A partir do Postgres 18 a imagem guarda os dados em
      # /var/lib/postgresql/<versão>/docker; o volume é montado no diretório pai.
      - garden_manager_postgres_data:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 força a checagem via TCP: na primeira inicialização a
      # imagem sobe um servidor temporário só no socket Unix (sem TCP), que
      # faria o pg_isready passar antes de o servidor definitivo estar pronto.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-garden} -d ${POSTGRES_DB:-garden_manager}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-garden}:${POSTGRES_PASSWORD:-garden}@postgres:5432/${POSTGRES_DB:-garden_manager}?sslmode=disable"
      - "up"

volumes:
  garden_manager_postgres_data:
